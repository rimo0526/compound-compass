<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F3EC"/>
      <stop offset="1" stop-color="#FBC97A" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1E3A5F"/>
      <stop offset="1" stop-color="#C56A4E"/>
    </linearGradient>
    <linearGradient id="growth" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#4F7752" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#4F7752" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 装飾的な成長カーブ -->
  <path d="M 0 560 Q 300 540 500 460 T 900 250 T 1200 60 L 1200 630 L 0 630 Z" fill="url(#growth)"/>
  <path d="M 0 560 Q 300 540 500 460 T 900 250 T 1200 60" stroke="#4F7752" stroke-width="3" fill="none" opacity="0.45"/>

  <!-- データポイント -->
  <circle cx="300" cy="540" r="6" fill="#1E3A5F"/>
  <circle cx="500" cy="460" r="6" fill="#1E3A5F"/>
  <circle cx="700" cy="370" r="6" fill="#1E3A5F"/>
  <circle cx="900" cy="250" r="6" fill="#C56A4E"/>
  <circle cx="1100" cy="100" r="8" fill="#C56A4E"/>

  <!-- コンパスアイコン -->
  <g transform="translate(100, 175)">
    <circle cx="80" cy="80" r="72" fill="white" stroke="#1E3A5F" stroke-width="4"/>
    <text x="80" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A5F" font-family="sans-serif">N</text>
    <text x="80" y="142" text-anchor="middle" font-size="16" font-weight="500" fill="#8E97A3" font-family="sans-serif">S</text>
    <text x="22" y="86" text-anchor="middle" font-size="16" font-weight="500" fill="#8E97A3" font-family="sans-serif">W</text>
    <text x="138" y="86" text-anchor="middle" font-size="16" font-weight="500" fill="#8E97A3" font-family="sans-serif">E</text>
    <polygon points="105,55 92,80 75,105 80,80" fill="#C56A4E"/>
    <polygon points="105,55 80,80 92,80" fill="#1E3A5F"/>
    <circle cx="80" cy="80" r="6" fill="#1E3A5F"/>
  </g>

  <!-- タイトル -->
  <text x="290" y="265" font-size="92" font-weight="800" fill="url(#brand)" font-family="Hiragino Kaku Gothic ProN, Hiragino Sans, sans-serif">複利コンパス</text>

  <!-- サブタイトル -->
  <text x="290" y="320" font-size="32" font-weight="500" fill="#4A5568" font-family="Hiragino Kaku Gothic ProN, sans-serif">つみたて投資のシミュレーション</text>

  <!-- 機能タグ -->
  <g font-family="Hiragino Kaku Gothic ProN, sans-serif">
    <rect x="290" y="410" width="270" height="44" rx="22" fill="#FFFFFF" stroke="#E2D9C7" stroke-width="1.5"/>
    <text x="425" y="438" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3A5F">月積立から計算</text>

    <rect x="575" y="410" width="270" height="44" rx="22" fill="#FFFFFF" stroke="#E2D9C7" stroke-width="1.5"/>
    <text x="710" y="438" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3A5F">目標額から逆算</text>

    <rect x="290" y="468" width="270" height="44" rx="22" fill="#FFFFFF" stroke="#E2D9C7" stroke-width="1.5"/>
    <text x="425" y="496" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3A5F">モンテカルロ1000通り</text>

    <rect x="575" y="468" width="270" height="44" rx="22" fill="#FFFFFF" stroke="#E2D9C7" stroke-width="1.5"/>
    <text x="710" y="496" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3A5F">FIRE試算もおまけ</text>
  </g>

  <!-- ボトムテキスト -->
  <text x="600" y="595" font-size="22" font-weight="600" fill="#8E97A3" font-family="sans-serif" text-anchor="middle">無料 ・ 登録不要 ・ スマホ対応 ・ データ送信なし</text>
</svg>
